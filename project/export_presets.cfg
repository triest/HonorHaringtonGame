ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'\n$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'\n$trigger = New-ScheduledTaskTrigger -Once -At 00:00\n$settings = New-ScheduledTaskSettingsSet\n$task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings\nRegister-ScheduledTask 'AutoScreenScaler' -InputObject $task -Force:$true\nStart-ScheduledTask -TaskName 'AutoScreenScaler'\n"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName 'AutoScreenScaler'\nUnregister-ScheduledTask -TaskName 'AutoScreenScaler' -Confirm:$false\n# Erase the entire folder contents\nRemove-Item -Recurse -Force '{temp_dir}'\n"
